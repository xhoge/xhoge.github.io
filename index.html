<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Dial StudioでM5Stack Dialのマクロ、レイヤー、アイドル画像を設定。">
  <title>Tools — Dial Studio</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;background:#0b111b;color:#edf4fc}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:48px 24px}
    main{width:100%;max-width:680px}.eyebrow{font-size:12px;letter-spacing:.16em;color:#91a8bc;margin:0 0 16px}
    h1{font-size:clamp(30px,6vw,44px);letter-spacing:-.04em;line-height:1.2;margin:0 0 38px;font-weight:650}
    .tool{display:flex;gap:24px;align-items:center;padding:30px;border:1px solid #2c3c4d;border-radius:20px;background:#111e2c;color:inherit;text-decoration:none;transition:border-color .15s,background .15s}
    .tool:hover{border-color:#32d5d2;background:#142737}.tool:focus-visible{outline:3px solid #32d5d2;outline-offset:6px}
    .mark{width:64px;height:64px;flex-shrink:0;color:#32d5d2}.content{flex:1;min-width:0}
    h2{font-size:25px;letter-spacing:-.035em;margin:0 0 9px;font-weight:600}.description{margin:0;color:#9db0c3;font-size:14px;line-height:1.9}
    .open{display:inline-flex;align-items:center;gap:10px;margin-top:20px;color:#70e4df;font-size:14px;font-weight:600}.arrow{font-size:20px;font-weight:400}
    @media(max-width:480px){body{padding:32px 20px}.tool{align-items:flex-start;gap:16px;padding:24px 20px}.mark{width:44px;height:44px}h2{font-size:22px}.description{font-size:13px}}
    @media(prefers-reduced-motion:reduce){.tool{transition:none}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">TOOLS</p>
    <h1>ツール一覧</h1>
    <a class="tool" href="./dialStudio/connection-test.html" aria-label="Dial Studioを開く">
      <svg class="mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <circle cx="32" cy="32" r="27" stroke="#30485b" stroke-width="5"/>
        <path d="M32 5a27 27 0 0 1 27 27" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
        <circle cx="32" cy="32" r="17" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="32" cy="32" r="3" fill="currentColor"/>
      </svg>
      <div class="content">
        <h2>Dial Studio</h2>
        <p class="description">M5Stack Dialのマクロ・レイヤー・<br>アイドル画像を設定します。</p>
        <span class="open">開く <span class="arrow" aria-hidden="true">→</span></span>
      </div>
    </a>
  </main>
</body>
</html>
